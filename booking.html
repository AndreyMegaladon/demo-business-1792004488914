<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - L'Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 font-sans">

    <header class="sticky top-0 z-50 backdrop-blur-md bg-stone-950/80 border-b border-stone-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-serif tracking-widest text-amber-500">L'EXCELLENCE</a>
            <nav class="hidden md:flex space-x-8 text-sm uppercase tracking-wider text-stone-300">
                <a href="index.html" class="hover:text-amber-500 transition">Inicio</a>
                <a href="about.html" class="hover:text-amber-500 transition">Nosotros</a>
                <a href="services.html" class="hover:text-amber-500 transition">Menú</a>
                <a href="gallery.html" class="hover:text-amber-500 transition">Galería</a>
                <a href="contacts.html" class="hover:text-amber-500 transition">Contacto</a>
            </nav>
            <a href="booking.html" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-semibold px-5 py-2.5 rounded-full transition shadow-lg shadow-amber-900/20">Reservar Mesa</a>
        </div>
    </header>

    <section class="py-24 max-w-2xl mx-auto px-6">
        <div class="text-center mb-12">
            <span class="text-amber-500 uppercase tracking-widest text-sm font-semibold mb-4 block">Reservas</span>
            <h1 class="text-4xl font-serif font-bold text-stone-100 mb-2">Reserva tu Mesa</h1>
            <p class="text-stone-400">Completa el formulario para asegurar tu experiencia.</p>
        </div>

        <form action="https://formsubmit.co/contacto@lexcellence.com" method="POST" class="bg-stone-900 border border-stone-800 p-8 rounded-2xl shadow-2xl space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-stone-300 mb-2">Nombre</label>
                    <input type="text" name="Nombre" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-300 mb-2">Teléfono</label>
                    <input type="tel" name="Telefono" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-stone-300 mb-2">Email</label>
                <input type="email" name="Email" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-stone-300 mb-2">Fecha</label>
                    <input type="date" name="Fecha" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-300 mb-2">Hora</label>
                    <input type="time" name="Hora" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-300 mb-2">Comensales</label>
                    <select name="Comensales" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <option>1 Persona</option>
                        <option selected>2 Personas</option>
                        <option>3 Personas</option>
                        <option>4 Personas</option>
                        <option>5+ Personas</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-stone-300 mb-2">Servicio</label>
                <select name="Servicio" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option>Cena</option>
                    <option>Almuerzo</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-stone-300 mb-2">Comentarios</label>
                <textarea name="Comentarios" rows="3" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-stone-950 font-semibold py-4 rounded-xl transition shadow-xl">Confirmar Reserva</button>
        </form>
    </section>

    <footer class="bg-stone-900 border-t border-stone-800 py-12 text-center text-stone-400 text-sm">
        <p>&copy; 2024 L'Excellence. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
