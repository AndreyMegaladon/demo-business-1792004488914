<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - L'Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 font-sans">

    <header class="sticky top-0 z-50 backdrop-blur-md bg-stone-950/80 border-b border-stone-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-serif tracking-widest text-amber-500">L'EXCELLENCE</a>
            <nav class="hidden md:flex space-x-8 text-sm uppercase tracking-wider text-stone-300">
                <a href="index.html" class="hover:text-amber-500 transition">Inicio</a>
                <a href="about.html" class="hover:text-amber-500 transition">Nosotros</a>
                <a href="services.html" class="hover:text-amber-500 transition">Menú</a>
                <a href="gallery.html" class="text-amber-500 font-semibold">Galería</a>
                <a href="contacts.html" class="hover:text-amber-500 transition">Contacto</a>
            </nav>
            <a href="booking.html" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-semibold px-5 py-2.5 rounded-full transition shadow-lg shadow-amber-900/20">Reservar Mesa</a>
        </div>
    </header>

    <section class="py-24 max-w-7xl mx-auto px-6">
        <div class="text-center mb-16">
            <span class="text-amber-500 uppercase tracking-widest text-sm font-semibold mb-4 block">Visuales</span>
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-stone-100 mb-4">Galería de Imágenes</h1>
            <p class="text-stone-400">Un vistazo a nuestros platos y ambiente.</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="aspect-square overflow-hidden rounded-2xl border border-stone-800">
                <img src="https://images.unsplash.com/photo-1544025162-d76694265947" alt="Plato 1" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            </div>
            <div class="aspect-square overflow-hidden rounded-2xl border border-stone-800">
                <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c" alt="Plato 2" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            </div>
            <div class="aspect-square overflow-hidden rounded-2xl border border-stone-800">
                <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87" alt="Plato 3" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            </div>
            <div class="aspect-square overflow-hidden rounded-2xl border border-stone-800">
                <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4" alt="Restaurante" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            </div>
            <div class="aspect-square overflow-hidden rounded-2xl border border-stone-800">
                <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5" alt="Interior" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            </div>
            <div class="aspect-square overflow-hidden rounded-2xl border border-stone-800">
                <img src="https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c" alt="Ambiente" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            </div>
        </div>
    </section>

    <footer class="bg-stone-900 border-t border-stone-800 py-12 text-center text-stone-400 text-sm">
        <p>&copy; 2024 L'Excellence. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
